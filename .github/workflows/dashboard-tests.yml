name: Dashboard regression checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'dashboard/**'
      - 'scripts/**'
      - 'tests/**'
      - 'run_history.py'
      - 'watcher.py'
      - 'vip_watcher.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/dashboard-data.test.cjs
